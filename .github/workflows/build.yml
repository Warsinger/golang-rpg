name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish this revision (main production; branches require preview_pr)
        type: boolean
        default: false
      preview_pr:
        description: Open same-repository PR number for a manual preview
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go mod tidy -diff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check native application
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build | Out-Null
          go test -count=1 -covermode=atomic '-coverpkg=./...' '-coverprofile=build/coverage.out' ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go tool cover '-func=build/coverage.out' | Tee-Object -FilePath build/coverage.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go tool cover '-html=build/coverage.out' -o build/coverage.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o build/golang-rpg.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check WebAssembly compilation
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          go build -o build/golang-rpg.wasm .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Coverage summary
        if: always() && hashFiles('build/coverage.txt') != ''
        run: |
          '### RPG statement coverage' | Add-Content $env:GITHUB_STEP_SUMMARY
          '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content build/coverage.txt | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rpg-coverage
          path: |
            build/coverage.out
            build/coverage.txt
            build/coverage.html
          if-no-files-found: warn
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test scripts/*.test.mjs
      - run: go run ./cmd/web
      - run: node scripts/package-pages.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: gorpg-web
          path: build/pages
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: [build, browser]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    uses: Warsinger/cloudflare-pages-deploy/.github/workflows/pages.yml@8ed38d395ac53e4d2172f0ad18e4b7fe0abfd014
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    with:
      deployment-ref: 8ed38d395ac53e4d2172f0ad18e4b7fe0abfd014
      artifact-name: gorpg-web
      project-name: gorpg
      hostname: gorpg.pages.dev
      title: Go RPG
      preview-pr: ${{ inputs.preview_pr }}
      comment-marker: '<!-- gorpg-preview -->'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
