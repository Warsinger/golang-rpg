name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go mod tidy -diff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check native application
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build | Out-Null
          go test -count=1 -covermode=atomic '-coverprofile=build/coverage.out' ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go tool cover '-func=build/coverage.out' | Tee-Object -FilePath build/coverage.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go tool cover '-html=build/coverage.out' -o build/coverage.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o build/golang-rpg.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check WebAssembly compilation
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          go build -o build/golang-rpg.wasm .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Coverage summary
        if: always() && hashFiles('build/coverage.txt') != ''
        run: |
          '### RPG statement coverage' | Add-Content $env:GITHUB_STEP_SUMMARY
          '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content build/coverage.txt | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rpg-coverage
          path: |
            build/coverage.out
            build/coverage.txt
            build/coverage.html
          if-no-files-found: warn
          retention-days: 14
